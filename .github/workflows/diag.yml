name: Temporary source diagnostics
on:
  push:
    branches: [claude/source-diagnostics]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node probe.mjs
      - name: Save results to this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f out
          git commit -q -m "probe results" && git push -q origin HEAD:claude/source-diagnostics
