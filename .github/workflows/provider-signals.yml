name: Refresh live provider signals

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out production source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch provider signals
        run: node scripts/refresh-provider-signals.mjs
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          UBER_ACCESS_TOKEN: ${{ secrets.UBER_ACCESS_TOKEN }}
          UBER_CLIENT_ID: ${{ secrets.UBER_CLIENT_ID }}
          UBER_CLIENT_SECRET: ${{ secrets.UBER_CLIENT_SECRET }}
          UBER_ESTIMATES_SCOPE: ${{ vars.UBER_ESTIMATES_SCOPE }}
          BOOKING_API_KEY: ${{ secrets.BOOKING_API_KEY }}
          BOOKING_AFFILIATE_ID: ${{ secrets.BOOKING_AFFILIATE_ID }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Home Base
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy refreshed provider data
        id: deployment
        uses: actions/deploy-pages@v4
