name: Deploy Home Base to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate planner before deployment
        run: |
          node scripts/check-index-syntax.mjs
          node --check dist/homebase-planner.js
          node --check dist/homebase-live.js
          node --check dist/sw.js
          node --test scripts/homebase-planner.test.mjs scripts/homebase-heat.test.mjs scripts/baltimore-demand-areas.test.mjs scripts/refresh-provider-signals.test.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Home Base
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
