name: Deploy Home Base to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Every published snapshot passes the app checks. A feed refresh cannot cancel
# a running release validation or deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate application before deployment
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build:backend-client
          git diff --exit-code -- dist/homebase-backend.js
          npm run build:dispatch-function
          node scripts/check-index-syntax.mjs
          node --check dist/homebase-growth.js
          node --check dist/homebase-planner.js
          node --check dist/homebase-earnings.js
          node --check dist/homebase-live.js
          node --check dist/homebase-dispatch.js
          node --check dist/homebase-copilot.js
          node --check dist/homebase-live-assistant.js
          node --check dist/sw.js
      - name: Fetch provider signals
        run: node scripts/refresh-provider-signals.mjs
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          UBER_ACCESS_TOKEN: ${{ secrets.UBER_ACCESS_TOKEN }}
          UBER_CLIENT_ID: ${{ secrets.UBER_CLIENT_ID }}
          UBER_CLIENT_SECRET: ${{ secrets.UBER_CLIENT_SECRET }}
          UBER_ESTIMATES_SCOPE: ${{ vars.UBER_ESTIMATES_SCOPE }}
          BOOKING_API_KEY: ${{ secrets.BOOKING_API_KEY }}
          BOOKING_AFFILIATE_ID: ${{ secrets.BOOKING_AFFILIATE_ID }}
          FLIGHTAWARE_API_KEY: ${{ secrets.FLIGHTAWARE_API_KEY }}
      - name: Build public runtime configuration
        run: node scripts/write-runtime-config.mjs
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Home Base
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
