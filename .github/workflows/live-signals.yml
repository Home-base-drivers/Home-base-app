name: Refresh live demand signals

# Data-only refresh. It never changes main or the deployed app code: each run
# rebuilds provider-signals.json from public sources and connected provider
# feeds, then replaces the single commit on the machine-owned `signals` branch.
# Only markets with a driver in the app in the last 2 hours are refreshed
# (market-activity table); other markets keep their last data and make no feed
# calls, and a pass with no active market stops before doing anything. A driver
# opening the app in a stale market starts a run through the market-activity
# Edge Function (workflow_dispatch with `markets`).
on:
  schedule:
    - cron: '4-59/10 * * * *'
  workflow_dispatch:
    inputs:
      markets:
        description: 'Comma list of market ids, or "all" (empty = markets with active drivers)'
        required: false
        default: ''

permissions:
  contents: write

# Never overlap two refreshes; a newer scheduled run waits for the current one.
concurrency:
  group: live-signals
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Pick markets with active drivers
        id: pick
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          REQUESTED: ${{ github.event.inputs.markets }}
        run: |
          set -u
          requested="$(printf '%s' "${REQUESTED:-}" | tr -cd 'a-z0-9,_-')"
          if [ "${REQUESTED:-}" = "all" ]; then echo "markets=all" >> "$GITHUB_OUTPUT"; exit 0; fi
          active=""
          # Repository variables are scoped to the Pages environment; the same public
          # browser values are in dist/homebase-config.js.
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            cfg="$(curl -sf --max-time 15 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/dist/homebase-config.js" || true)"
            SUPABASE_URL="$(printf '%s' "$cfg" | grep -o "https://[a-z0-9-]*\.supabase\.co" | head -1)"
            SUPABASE_PUBLISHABLE_KEY="$(printf '%s' "$cfg" | grep -o "sb_publishable_[A-Za-z0-9_-]*" | head -1)"
          fi
          if [ -n "${SUPABASE_URL:-}" ] && [ -n "${SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            if body="$(curl -sf --max-time 15 -X POST "$SUPABASE_URL/rest/v1/rpc/active_markets" -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H 'Content-Type: application/json' -d '{"p_minutes":120}')"; then
              active="$(printf '%s' "$body" | tr -d '[]" ' | tr -cd 'a-z0-9,_-')"
            else
              # Activity list unreachable: refresh everything rather than go dark.
              echo "Active-market list unreachable; refreshing all markets."
              echo "markets=all" >> "$GITHUB_OUTPUT"; exit 0
            fi
          else
            echo "Supabase address unavailable; refreshing all markets."
            echo "markets=all" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Active markets: ${active:-none}; requested: ${requested:-none}" 
          markets="$(printf '%s,%s' "$requested" "$active" | tr ',' '\n' | grep -v '^$' | sort -u | paste -sd, -)"
          if [ -z "$markets" ]; then echo "No drivers active in any market; skipping (no feed calls)."; fi
          echo "markets=$markets" >> "$GITHUB_OUTPUT"
      - name: Check out current main
        if: steps.pick.outputs.markets != ''
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node
        if: steps.pick.outputs.markets != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        if: steps.pick.outputs.markets != ''
        run: npm ci --ignore-scripts
      - name: Refresh public and provider signals
        if: steps.pick.outputs.markets != ''
        run: node scripts/refresh-provider-signals.mjs
        env:
          HOMEBASE_MARKETS: ${{ steps.pick.outputs.markets }}
          # Read-only use: fetch the current signals branch file for carry-forward.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          UBER_ACCESS_TOKEN: ${{ secrets.UBER_ACCESS_TOKEN }}
          UBER_CLIENT_ID: ${{ secrets.UBER_CLIENT_ID }}
          UBER_CLIENT_SECRET: ${{ secrets.UBER_CLIENT_SECRET }}
          UBER_ESTIMATES_SCOPE: ${{ vars.UBER_ESTIMATES_SCOPE }}
          BOOKING_API_KEY: ${{ secrets.BOOKING_API_KEY }}
          BOOKING_AFFILIATE_ID: ${{ secrets.BOOKING_AFFILIATE_ID }}
          FLIGHTAWARE_API_KEY: ${{ secrets.FLIGHTAWARE_API_KEY }}
      - name: Validate snapshot before publishing
        if: steps.pick.outputs.markets != ''
        run: node scripts/validate-signals.mjs dist/provider-signals.json
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          UBER_ACCESS_TOKEN: ${{ secrets.UBER_ACCESS_TOKEN }}
          UBER_CLIENT_ID: ${{ secrets.UBER_CLIENT_ID }}
          UBER_CLIENT_SECRET: ${{ secrets.UBER_CLIENT_SECRET }}
          BOOKING_API_KEY: ${{ secrets.BOOKING_API_KEY }}
          BOOKING_AFFILIATE_ID: ${{ secrets.BOOKING_AFFILIATE_ID }}
          FLIGHTAWARE_API_KEY: ${{ secrets.FLIGHTAWARE_API_KEY }}
      - name: Publish to the signals branch
        if: steps.pick.outputs.markets != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          out="$RUNNER_TEMP/signals"
          mkdir -p "$out"
          cp dist/provider-signals.json "$out/"
          # Every area's source list with live status, item counts and check times.
          node scripts/area-sources.mjs --status dist/provider-signals.json "$out/area-sources-status.csv"
          printf '%s\n' 'Machine-owned live data branch. Written by .github/workflows/live-signals.yml; do not edit by hand.' > "$out/README.md"
          cd "$out"
          git init -q -b signals
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add provider-signals.json area-sources-status.csv README.md
          git commit -q -m "data: live demand signals $(date -u +%Y-%m-%dT%H:%MZ)"
          # A single replaced commit keeps the data branch small; it never touches main.
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/signals
