name: Validate Home Base

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned backend dependencies
        run: npm ci --ignore-scripts
      - name: Verify the backend browser bundle
        run: |
          npm run build:backend-client
          git diff --exit-code -- dist/homebase-backend.js
      - name: Validate application JavaScript
        run: |
          node scripts/check-index-syntax.mjs
          node --check dist/homebase-live.js
          node --check dist/homebase-planner.js
          node --check dist/homebase-earnings.js
          node --check dist/homebase-heat.js
          node --check dist/homebase-growth.js
      - name: Test the app and private account backend
        run: npm test
